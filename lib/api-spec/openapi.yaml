    JournalDeleteResult:
      type: object
      properties:
        deleted: { type: boolean }
      required: [deleted]

    # ── Voice interview ──────────────────────────────────────────────────────

    InterviewSpeakRequest:
      type: object
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
      required: [text]

    InterviewSpeakResponse:
      type: object
      properties:
        audioBase64: { type: string }
        mimeType:    { type: string }
      required: [audioBase64, mimeType]

    InterviewTurnRequest:
      type: object
      properties:
        phase:
          type: string
          enum: [answer, confirm]
        question: { type: string, minLength: 1 }
        hint:     { type: string }
        priorAnswer: { type: string }
        probeUsed:   { type: boolean }
        audioBase64: { type: string, minLength: 1 }
        audioMimeType: { type: string }
        # "date": the answer is a spoken date/day reference; resolve it to dd.mm.yyyy
        mode: { type: string, enum: [date] }
      required: [phase, question, audioBase64]

    InterviewTurnResponse:
      type: object
      properties:
        transcript: { type: string }
        action:
          type: string
          enum: [probe, confirm, next, continue]
        say: { type: ["string", "null"] }
        # dd.mm.yyyy when mode=date and the reply could be resolved
        dateResolved: { type: ["string", "null"] }
      required: [transcript, action]

    InterviewWriteupRequest:
      type: object
      properties:
        kind:  { type: string }
        title: { type: string }
        qa:
          type: array
          items:
            type: object
            properties:
              fieldId:  { type: string }
              label:    { type: string }
              hint:     { type: string }
              answers:
                type: array
                items: { type: string }
            required: [fieldId, label, answers]
      required: [kind, qa]

    LastMeetingFactsResponse:
      type: object
      properties:
        # Same lines lastMeetingFacts() feeds into the AI prompt and the PPTX,
        # so the on-screen panel always agrees with the generated briefing.
        facts:
          type: array
          items: { type: string }
      required: [facts]

    WeekAheadBriefRequest:
      type: object
      properties:
        opponent: { type: string, minLength: 1 }
        # When provided, the server also looks up the last league meeting vs the
        # opponent (league tables) and our latest saved pre-match deck.
        seasonId: { type: integer }
        leagueId: { type: integer }
        # Condensed plain-text blocks assembled client-side
        reflectionsText:    { type: string }
        lastVsOpponentText: { type: string }
        theirGamesText:     { type: string }
        ourGamesText:       { type: string }
        # Continuity inputs (Task: consider previous meeting + our last match report)
        lastMeetingText:    { type: string }
        lastReportText:     { type: string }
        # What we worked on in training in the lead-up to the last meeting vs
        # this opponent (client-side reflection lookup).
        prevMeetingPrepText: { type: string }
      required: [opponent]

    WeekAheadBriefResponse:
      type: object
      properties:
        review:
          type: array
          items: { type: string }
        pointers:
          type: array
          items: { type: string }
        # Deterministic headline facts from the last league meeting vs this
        # opponent (score, scorers, goal types) — empty when it's the first meeting.
        lastMeeting:
          type: array
          items: { type: string }
        # Suggested training focuses for the week, each grounded in the
        # opponent's recent strengths/weaknesses, the last meeting, or our own
        # recent form.
        trainingFocus:
          type: array
          items: { type: string }
      required: [review, pointers]

    PrematchBriefRequest:
      type: object
      properties:
        opponent:      { type: string, minLength: 1 }
        formation:     { type: string }
        gamePlanNotes: { type: string }
        # Condensed plain-text opponent scout block assembled client-side
        scoutText:     { type: string }
      required: [opponent]

    PrematchUnitObjectives:
      type: object
      properties:
        theme:
          type: string
        gk:
          type: array
          items: { type: string }
        defenders:
          type: array
          items: { type: string }
        midfielders:
          type: array
          items: { type: string }
        attackers:
          type: array
          items: { type: string }
      required: [theme, gk, defenders, midfielders, attackers]

    PrematchBriefResponse:
      type: object
      properties:
        bp:
          $ref: "#/components/schemas/PrematchUnitObjectives"
        bpo:
          $ref: "#/components/schemas/PrematchUnitObjectives"
      required: [bp, bpo]

    PrematchTalkRequest:
      type: object
      properties:
        opponent:      { type: string, minLength: 1 }
        seasonId:      { type: integer }
        leagueId:      { type: integer }
        gamePlanNotes: { type: string }
      required: [opponent]

    PrematchTalkResponse:
      type: object
      properties:
        lines:
          type: array
          items: { type: string }
      required: [lines]

    InterviewWriteupResponse:
      type: object
      properties:
        content:
          type: object
          additionalProperties: { type: string }
      required: [content]
