    MatchReportInsight:
      type: object
      properties:
        tone: { type: string, enum: [good, watch, info] }
        text: { type: string }
      required: [tone, text]

    MatchReportFormEntry:
      type: object
      properties:
        result:   { type: string }
        opponent: { type: string }
        score:    { type: string }
        isThisMatch: { type: boolean }
      required: [result, opponent, score, isThisMatch]

    MatchReportGps:
      type: object
      description: GPS numbers for this game, when a Catapult upload exists for the round.
      properties:
        totalDistanceKm:  { type: ["number", "null"] }
        defendersMPerMin: { type: ["number", "null"] }
        midfieldersMPerMin: { type: ["number", "null"] }
        forwardsHighSpeedM: { type: ["number", "null"] }
        playerCount:      { type: integer }
        seasonAvgTotalDistanceKm:   { type: ["number", "null"], description: "Per-round season average (other rounds this year, same squad)." }
        seasonAvgDefendersMPerMin:  { type: ["number", "null"] }
        seasonAvgMidfieldersMPerMin: { type: ["number", "null"] }
        seasonAvgForwardsHighSpeedM: { type: ["number", "null"] }
        gamesInAvg: { type: ["integer", "null"], description: "How many other rounds the season averages are built from." }
        players:
          type: array
          description: Per-player game rows behind the position averages.
          items: { $ref: "#/components/schemas/MatchReportGpsPlayer" }
      required: [totalDistanceKm, defendersMPerMin, midfieldersMPerMin, forwardsHighSpeedM, playerCount, seasonAvgTotalDistanceKm, seasonAvgDefendersMPerMin, seasonAvgMidfieldersMPerMin, seasonAvgForwardsHighSpeedM, gamesInAvg, players]

    MatchReportGpsPlayer:
      type: object
      properties:
        name:     { type: string }
        position: { type: ["string", "null"] }
        mins:     { type: ["number", "null"] }
        distanceKm: { type: ["number", "null"] }
        mPerMin:  { type: ["number", "null"] }
        sprintDistanceM: { type: ["number", "null"] }
      required: [name, position, mins, distanceKm, mPerMin, sprintDistanceM]

    MatchReportGoalDnaCategory:
      type: object
      properties:
        id:    { type: string, enum: [setPiece, frontThird, middleThird, backThird] }
        label: { type: string }
        count: { type: integer }
        dt:    { type: integer, description: "During-transition goals in this category (regain categories only)." }
        at:    { type: integer, description: "After-transition goals in this category (regain categories only)." }
        pct:   { type: ["number", "null"] }
        benchmarkLabel: { type: string, description: "e.g. 27% or 48-50%" }
        verdict:
          type: ["string", "null"]
          enum: [high, low, null]
          description: Season share sits clearly above/below the benchmark band (null = typical or sample too small).
      required: [id, label, count, dt, at, pct, benchmarkLabel, verdict]

    MatchReportGoalDnaSide:
      type: object
      properties:
        totalTyped: { type: integer, description: "Season-to-date goals with a goal type recorded." }
        categories:
          type: array
          items: { $ref: "#/components/schemas/MatchReportGoalDnaCategory" }
        matchLines:
          type: array
          items: { type: string }
          description: Interpretation lines for THIS match's goals on this side.
      required: [totalTyped, categories, matchLines]

    MatchReportGoalDnaGoal:
      type: object
      description: One goal from THIS match, with a badge placing it against the season DNA.
      properties:
        side:      { type: string, enum: [scored, conceded] }
        minute:    { type: ["integer", "null"] }
        scorer:    { type: ["string", "null"] }
        goalType:  { type: ["string", "null"] }
        category:  { type: ["string", "null"], description: "Human label, e.g. middle-third regain" }
        timing:
          type: ["string", "null"]
          enum: [DT, AT, null]
        badgeTone: { type: string, enum: [signature, rare, typical, untyped] }
        badgeText: { type: string }
      required: [side, minute, scorer, goalType, category, timing, badgeTone, badgeText]

    MatchReportGoalDna:
      type: object
      description: The goals-by-type story — this match's goals interpreted, and the season mix vs benchmark shares.
      properties:
        scored:   { $ref: "#/components/schemas/MatchReportGoalDnaSide" }
        conceded: { $ref: "#/components/schemas/MatchReportGoalDnaSide" }
        comments:
          type: array
          items: { type: string }
          description: Season-level strength/weakness headlines from benchmark deviations.
        matchGoals:
          type: array
          items: { $ref: "#/components/schemas/MatchReportGoalDnaGoal" }
          description: This match's goals in minute order, each badged vs the season DNA. Optional — absent on reports saved before this existed.
        tacticalRead:
          type: array
          items: { type: string }
          description: 2–3 sentence tactical read from goal minutes + types. Optional — absent on older saved reports.
        dayInsights:
          type: array
          items: { type: string }
          description: Up to 3 insights from today's goals — partnerships, scoring streaks, head-to-head goal-type patterns. Optional — absent on older saved reports.
        insightBadges:
          type: array
          items: { $ref: "#/components/schemas/MatchReportGoalDnaBadge" }
          description: Up to 4 weighted headline squares (goal type, timing, scorer, assists, defence). Optional — absent on older saved reports.
        vsSeason:
          type: array
          items: { $ref: "#/components/schemas/MatchReportInsight" }
          description: Up to 2 "vs the season" lines reading today's typed goals against the season fingerprint (origin third, transition state, pass count). Empty when the game's goals aren't typed. Optional — absent on older saved reports.
      required: [scored, conceded, comments]

    MatchReportGoalDnaBadge:
      type: object
      properties:
        label: { type: string }
        value: { type: string }
        sub:   { type: ["string", "null"] }
        tone:
          type: string
          enum: [watch]
          description: Optional — "watch" marks a concern badge (something to resolve), rendered amber.
      required: [label, value, sub]

    MatchReportBallUsePoint:
      type: object
      properties:
        label:      { type: string }
        possession: { type: number }
        shotsPer100Passes: { type: number }
        result:     { type: ["string", "null"] }
        isThisMatch: { type: boolean }
      required: [label, possession, shotsPer100Passes, result, isThisMatch]

    MatchReportBallUse:
      type: object
      description: Possession vs possession-effectiveness quadrant for this match, with ball-use commentary.
      properties:
        possession:        { type: number }
        passesPerShot:     { type: number }
        shotsPer100Passes: { type: number }
        # Optional (not required) — older saved reports won't carry them.
        passes:            { type: number }
        seasonAvgPasses:   { type: ["number", "null"] }
        seasonAvgPossession: { type: ["number", "null"] }
        seasonAvgShotsPer100: { type: ["number", "null"] }
        quadrant:
          type: ["string", "null"]
          enum: [control, sterile, direct, chasing, null]
        points:
          type: array
          items: { $ref: "#/components/schemas/MatchReportBallUsePoint" }
        comments:
          type: array
          items: { type: string }
      required: [possession, passesPerShot, shotsPer100Passes, seasonAvgPossession, seasonAvgShotsPer100, quadrant, points, comments]

    MatchReportMeeting:
      type: object
      description: An earlier meeting with the same opponent this season.
      properties:
        matchLabel: { type: string }
        matchDate:  { type: ["string", "null"] }
        score:      { type: string }
        result:     { type: ["string", "null"] }
      required: [matchLabel, matchDate, score, result]

    MatchReportResponse:
      type: object
      properties:
        header: { $ref: "#/components/schemas/MatchReportHeader" }
        tiles:
          type: array
          items: { $ref: "#/components/schemas/MatchReportTile" }
        goals:
          type: array
          items: { $ref: "#/components/schemas/MatchReportGoal" }
        insights:
          type: array
          items: { $ref: "#/components/schemas/MatchReportInsight" }
        form:
          type: array
          items: { $ref: "#/components/schemas/MatchReportFormEntry" }
        ladderPos:    { type: ["integer", "null"] }
        ladderPoints: { type: ["integer", "null"] }
        teamsInLeague: { type: ["integer", "null"] }
        gps:
          oneOf:
            - { $ref: "#/components/schemas/MatchReportGps" }
            - { type: "null" }
        previousMeetings:
          type: array
          items: { $ref: "#/components/schemas/MatchReportMeeting" }
        ballUse:
          oneOf:
            - { $ref: "#/components/schemas/MatchReportBallUse" }
            - { type: "null" }
        goalDna:
          oneOf:
            - { $ref: "#/components/schemas/MatchReportGoalDna" }
            - { type: "null" }
      required: [header, tiles, goals, insights, form, ladderPos, ladderPoints, teamsInLeague, gps, previousMeetings, ballUse, goalDna]

    SeasonReportRound:
      type: object
      properties:
        matchRowId: { type: integer }
        round: { type: string }
        date: { type: ["string", "null"] }
        opponent: { type: string }
        result: { type: ["string", "null"], description: "W / D / L, null when unplayed" }
        htResult: { type: ["string", "null"], description: "Half-time W / D / L oriented to us" }
        goalsFor: { type: ["integer", "null"] }
        goalsAgainst: { type: ["integer", "null"] }
        possession: { type: ["number", "null"] }
        passes: { type: ["integer", "null"] }
        shots: { type: ["integer", "null"] }
        oppShots: { type: ["integer", "null"] }
      required: [matchRowId, round, date, opponent, result, htResult, goalsFor, goalsAgainst, possession, passes, shots, oppShots]

    SeasonReportTimingBand:
      type: object
      properties:
        band: { type: string, description: "e.g. 1–15, 76+" }
        scored: { type: integer }
        conceded: { type: integer }
        leaguePct: { type: ["number", "null"], description: "Share of ALL league goals this season that fall in this band" }
      required: [band, scored, conceded]

    SeasonReportDnaCat:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        count: { type: integer }
        pct: { type: ["number", "null"] }
        benchmarkPct: { type: ["number", "null"] }
        leaguePct: { type: ["number", "null"], description: "This season's league-wide share for this category (typed goals only)" }
      required: [id, label, count, pct, benchmarkPct]

    SeasonReportResponse:
      type: object
      properties:
        rounds:
          type: array
          items: { $ref: "#/components/schemas/SeasonReportRound" }
        timing:
          type: array
          items: { $ref: "#/components/schemas/SeasonReportTimingBand" }
        dnaMix:
          type: array
          items: { $ref: "#/components/schemas/SeasonReportDnaCat" }
        dnaTyped: { type: integer, description: "Our goals with a recorded DNA type" }
        leagueAvgGoals: { type: ["number", "null"], description: "League average goals per team per game this season" }
        insights:
          type: array
          items: { $ref: "#/components/schemas/MatchReportInsight" }
      required: [rounds, timing, dnaMix, dnaTyped, insights]

    GoalIntervalBucket:
      type: object
      properties:
        interval:         { type: string }
        goalsScored:      { type: integer }
        goalsConceded:    { type: integer }
        intervalStart:    { type: integer }
        intervalEnd:      { type: integer }
      required: [interval, goalsScored, goalsConceded, intervalStart, intervalEnd]

    ScoredGoalRecord:
      type: object
      properties:
        id:              { type: integer }
        matchId:         { type: ["integer", "null"] }
        minuteScored:    { type: ["integer", "null"] }
        goalType:        { type: ["string", "null"] }
        assistType:      { type: ["string", "null"] }
        buildupLane:     { type: ["string", "null"] }
        finishType:      { type: ["string", "null"] }
        howPenetrated:   { type: ["string", "null"] }
        firstTimeFinish: { type: ["boolean", "null"] }
        passString:      { type: ["string", "null"] }
        goalX:           { type: ["number", "null"] }
        goalY:           { type: ["number", "null"] }
        scorer:          { type: ["string", "null"] }
        assist:          { type: ["string", "null"] }
        opponent:        { type: ["string", "null"] }
        matchDate:       { type: ["string", "null"] }
        matchCode:       { type: ["string", "null"] }
        matchResult:     { type: ["string", "null"] }
      required: [id]

    GoalBreakdownResponse:
      type: object
      properties:
        opponents:
          type: array
          items: { type: string }
        goals:
          type: array
          items: { $ref: "#/components/schemas/ScoredGoalRecord" }
        conceded:
          type: array
          items: { $ref: "#/components/schemas/ScoredGoalRecord" }
      required: [opponents, goals, conceded]

    GpsLoadSummary:
      type: object
      properties:
        playerId:          { type: ["integer", "null"] }
        playerName:        { type: string }
        sessions:          { type: integer }
        avgDistanceKm:     { type: ["number", "null"] }
        avgSprintDistanceM: { type: ["number", "null"] }
        avgPlayerLoad:     { type: ["number", "null"] }
        avgTopSpeedMs:     { type: ["number", "null"] }
        avgHrLoad:         { type: ["number", "null"] }
        totalDistanceKm:   { type: ["number", "null"] }
        maxTopSpeedMs:     { type: ["number", "null"] }
      required: [playerName, sessions]

    # ── Clubs ─────────────────────────────────────────────────────────────────

    ClubInfo:
      type: object
      properties:
        id:           { type: integer }
        leagueId:     { type: integer }
        name:         { type: string }
        primaryColor: { type: string }
        logoUrl:      { type: ["string", "null"] }
      required: [id, leagueId, name, primaryColor]

    ClubInput:
      type: object
      properties:
        leagueId:     { type: integer }
        name:         { type: string }
        primaryColor: { type: string }
        logoUrl:      { type: ["string", "null"] }
      required: [leagueId, name]

    ClubUpdateInput:
      type: object
      properties:
        primaryColor: { type: ["string", "null"] }
        logoUrl:      { type: ["string", "null"] }

    CopyClubsBody:
      type: object
      properties:
        leagueId:       { type: integer, description: "Target league the clubs are copied into" }
        sourceLeagueId: { type: integer, description: "League to copy clubs from" }
      required: [leagueId, sourceLeagueId]

    CopyClubsResponse:
      type: object
      properties:
        added:   { type: integer }
        updated: { type: integer }
      required: [added, updated]

    ClubBrandingLookupBody:
      type: object
      properties:
        leagueId: { type: integer }
      required: [leagueId]

    ClubBrandingSuggestion:
      type: object
      properties:
        clubId:          { type: integer }
        name:            { type: string }
        currentColor:    { type: string }
        currentLogoUrl:  { type: ["string", "null"] }
        primaryColor:    { type: ["string", "null"] }
        logoUrl:         { type: ["string", "null"] }
      required: [clubId, name, currentColor]

    ClubBrandingLookupResponse:
      type: object
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/ClubBrandingSuggestion" }
        warnings:
          type: array
          items: { type: string }
      required: [suggestions, warnings]

    ExtractClubsBody:
      type: object
      properties:
        leagueId:    { type: integer }
        imageBase64: { type: ["string", "null"] }
        leagueName:  { type: ["string", "null"] }
      required: [leagueId]

    ExtractedClub:
      type: object
      properties:
        name:         { type: string }
        fullName:     { type: ["string", "null"] }
        primaryColor: { type: string }
        logoUrl:      { type: ["string", "null"] }
      required: [name, primaryColor]

    ExtractClubsResponse:
      type: object
      properties:
        clubs:
          type: array
          items: { $ref: "#/components/schemas/ExtractedClub" }
        warnings:
          type: array
          items: { type: string }
      required: [clubs, warnings]

    # ── Goals by Opponent ──────────────────────────────────────────────────────

    GoalsByOpponentEntry:
      type: object
      properties:
        goals:      { type: integer }
        minsPlayed: { type: integer }
      required: [goals, minsPlayed]

    GoalsByOpponentPlayer:
      type: object
      properties:
        playerName: { type: string }
        totalMins:  { type: integer }
        totalGoals: { type: integer }
        byOpponent:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/GoalsByOpponentEntry"
      required: [playerName, totalMins, totalGoals, byOpponent]

    GoalsByOpponentResponse:
      type: object
      properties:
        opponents:
          type: array
          items: { type: string }
        players:
          type: array
          items:
            $ref: "#/components/schemas/GoalsByOpponentPlayer"
      required: [opponents, players]

    # ── Assists by Opponent ────────────────────────────────────────────────────

    AssistsByOpponentEntry:
      type: object
      properties:
        assists:    { type: integer }
        minsPlayed: { type: integer }
      required: [assists, minsPlayed]

    AssistsByOpponentPlayer:
      type: object
      properties:
        playerName:   { type: string }
        totalMins:    { type: integer }
        totalAssists: { type: integer }
        byOpponent:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AssistsByOpponentEntry"
      required: [playerName, totalMins, totalAssists, byOpponent]

    AssistsByOpponentResponse:
      type: object
      properties:
        opponents:
          type: array
          items: { type: string }
        players:
          type: array
          items:
            $ref: "#/components/schemas/AssistsByOpponentPlayer"
      required: [opponents, players]

    # ── Opponent Players by Opponent (club-scoped goals/assists/mins) ───────────

    OpponentPlayerByOpponentEntry:
      type: object
      properties:
        goals:      { type: integer }
        assists:    { type: integer }
        minsPlayed: { type: integer }
      required: [goals, assists, minsPlayed]

    OpponentPlayerByOpponentPlayer:
      type: object
      properties:
        playerName:   { type: string }
        club:         { type: string, nullable: true }
        totalMins:    { type: integer }
        totalGoals:   { type: integer }
        totalAssists: { type: integer }
        totalStarts:  { type: integer }
        totalApps:    { type: integer }
        byOpponent:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/OpponentPlayerByOpponentEntry"
      required: [playerName, totalMins, totalGoals, totalAssists, totalStarts, totalApps, byOpponent]

    OpponentPlayersByOpponentResponse:
      type: object
      properties:
        opponents:
          type: array
          items: { type: string }
        players:
          type: array
          items:
            $ref: "#/components/schemas/OpponentPlayerByOpponentPlayer"
      required: [opponents, players]

    # ── Player Impact (team record when player starts vs doesn't) ─────────────

    PlayerImpactGame:
      type: object
      properties:
        matchId:  { type: string }
        round:    { type: integer, nullable: true }
        opponent: { type: string, nullable: true }
        result:   { type: string, enum: [W, D, L] }
        role:     { type: string, enum: [start, bench, out] }
      required: [matchId, round, opponent, result, role]

    PlayerImpactSide:
      type: object
      properties:
        matches: { type: integer }
        wins:    { type: integer }
        draws:   { type: integer }
        losses:  { type: integer }
        winPct:  { type: number, nullable: true }
        ppg:     { type: number, nullable: true }
        bench:   { type: integer }
        out:     { type: integer }
        games:
          type: array
          items:
            $ref: "#/components/schemas/PlayerImpactGame"
      required: [matches, wins, draws, losses, winPct, ppg, bench, out, games]

    PlayerImpactPlayer:
      type: object
      properties:
        playerName: { type: string }
        club:       { type: string }
        started:
          $ref: "#/components/schemas/PlayerImpactSide"
        notStarted:
          $ref: "#/components/schemas/PlayerImpactSide"
        diff: { type: number, nullable: true }
      required: [playerName, club, started, notStarted, diff]

    PlayerImpactResponse:
      type: object
      properties:
        totalMatches: { type: integer }
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerImpactPlayer"
      required: [totalMatches, players]

    # ── Opponent On-Field Impact (GD while player appeared, by opponent) ───────

    OpponentOnfieldImpactEntry:
      type: object
      properties:
        gf:   { type: integer }
        ga:   { type: integer }
        mins: { type: integer }
        apps: { type: integer }
      required: [gf, ga, mins, apps]

    OpponentOnfieldImpactPlayer:
      type: object
      properties:
        playerName: { type: string }
        club:       { type: string }
        byOpponent:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/OpponentOnfieldImpactEntry"
      required: [playerName, club, byOpponent]

    OpponentOnfieldImpactResponse:
      type: object
      properties:
        opponents:
          type: array
          items: { type: string }
        players:
          type: array
          items:
            $ref: "#/components/schemas/OpponentOnfieldImpactPlayer"
      required: [opponents, players]

    # ── Substitute impact (team goals while a sub was on the pitch) ────────────

    SubImpactPlayer:
      type: object
      properties:
        playerName: { type: string }
        club:       { type: string }
        subApps:    { type: integer }
        mins:       { type: integer }
        gf:         { type: integer }
        ga:         { type: integer }
        net:        { type: integer }
      required: [playerName, club, subApps, mins, gf, ga, net]

    SubImpactResponse:
      type: object
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/SubImpactPlayer"
      required: [players]

    # ── Unit breakdown (stats by GK/Defence/Midfield/Attack) ──────────────────

    UnitPlayerLine:
      type: object
      properties:
        playerName:  { type: string }
        minutes:     { type: integer }
        appearances: { type: integer }
        starts:      { type: integer }
        goals:       { type: integer }
        assists:     { type: integer }
      required: [playerName, minutes, appearances, starts, goals, assists]

    UnitBreakdownUnit:
      type: object
      properties:
        unit:        { type: string, enum: [GK, Defender, Midfielder, Forward, Unassigned] }
        minutes:     { type: integer }
        appearances: { type: integer }
        starts:      { type: integer }
        goals:       { type: integer }
        assists:     { type: integer }
        players:
          type: array
          items:
            $ref: "#/components/schemas/UnitPlayerLine"
      required: [unit, minutes, appearances, starts, goals, assists, players]

    UnitBreakdownResponse:
      type: object
      properties:
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitBreakdownUnit"
        gameDayRows:  { type: integer, description: "Stat rows whose unit came from the per-game position code" }
        assignedRows: { type: integer, description: "Stat rows that fell back to the assigned GPS position" }
        unknownRows:  { type: integer, description: "Stat rows with no usable position at all" }
      required: [units, gameDayRows, assignedRows, unknownRows]

    # ── Clutch goals (big goals in close matches) ──────────────────────────────

    ClutchGoalDetail:
      type: object
      properties:
        category: { type: string, enum: [winner, drawSaver, equaliser, goAhead] }
        opponent: { type: string }
        minute:   { type: integer, nullable: true }
        result:   { type: string }
      required: [category, opponent, result]

    ClutchPlayer:
      type: object
      properties:
        playerName:  { type: string }
        club:        { type: string }
        winners:     { type: integer }
        drawSavers:  { type: integer }
        equalisers:  { type: integer }
        goAheads:    { type: integer }
        total:       { type: integer }
        goals:
          type: array
          items:
            $ref: "#/components/schemas/ClutchGoalDetail"
      required: [playerName, club, winners, drawSavers, equalisers, goAheads, total, goals]

    ClutchGoalsResponse:
      type: object
      properties:
        closeMatches: { type: integer }
        players:
          type: array
          items:
            $ref: "#/components/schemas/ClutchPlayer"
      required: [closeMatches, players]

    # ── Goal Combos (assist → scorer partnerships) ─────────────────────────────

    GoalCombo:
      type: object
      properties:
        assister: { type: string }
        scorer:   { type: string }
        count:    { type: integer }
      required: [assister, scorer, count]

    GoalCombosResponse:
      type: object
      properties:
        combos:
          type: array
          items: { $ref: "#/components/schemas/GoalCombo" }
        totalGoals:    { type: integer }
        assistedGoals: { type: integer }
      required: [combos, totalGoals, assistedGoals]

    # ── Coach behaviour: first substitution ────────────────────────────────────

    FirstSubEntry:
      type: object
      properties:
        matchId:       { type: string }
        opponent:      { type: string }
        matchDate:     { type: string, nullable: true }
        minute:        { type: integer }
        player:        { type: string }
        gameState:     { type: string, enum: [Winning, Drawing, Losing] }
        result:        { type: string, enum: [W, D, L] }
        goalsFor15:    { type: integer }
        goalsAgainst15: { type: integer }
      required: [matchId, opponent, matchDate, minute, player, gameState, result, goalsFor15, goalsAgainst15]

    FirstSubStateSummary:
      type: object
      properties:
        state:        { type: string, enum: [Winning, Drawing, Losing] }
        matches:      { type: integer }
        avgMinute:    { type: number }
        goalsFor:     { type: integer }
        goalsAgainst: { type: integer }
        noGoal:       { type: integer }
        wins:         { type: integer }
        draws:        { type: integer }
        losses:       { type: integer }
      required: [state, matches, avgMinute, goalsFor, goalsAgainst, noGoal, wins, draws, losses]

    FirstSubResponse:
      type: object
      properties:
        matchesTracked:    { type: integer }
        avgFirstSubMinute: { type: number, nullable: true }
        subsPerMatch:      { type: number, nullable: true }
        preferredPlayer:   { type: string, nullable: true }
        preferredCount:    { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/FirstSubEntry" }
        byState:
          type: array
          items: { $ref: "#/components/schemas/FirstSubStateSummary" }
      required: [matchesTracked, avgFirstSubMinute, subsPerMatch, preferredPlayer, preferredCount, entries, byState]

    # ── Player Scoring DNA (radar) ─────────────────────────────────────────────

    PlayerDnaMetrics:
      type: object
      properties:
        goals:         { type: integer }
        goalsPer90:    { type: number }
        assists:       { type: integer }
        assistsPer90:  { type: number }
        firstTouchPct: { type: number }
        poacherPct:       { type: number }
        rightFoot:     { type: integer }
        leftFoot:      { type: integer }
        header:        { type: integer }
      required: [goals, goalsPer90, assists, assistsPer90, firstTouchPct, poacherPct, rightFoot, leftFoot, header]

    # Squad averages — same axes as PlayerDnaMetrics but every field is fractional.
    PlayerDnaAverages:
      type: object
      properties:
        goals:         { type: number }
        goalsPer90:    { type: number }
        assists:       { type: number }
        assistsPer90:  { type: number }
        firstTouchPct: { type: number }
        poacherPct:       { type: number }
        rightFoot:     { type: number }
        leftFoot:      { type: number }
        header:        { type: number }
      required: [goals, goalsPer90, assists, assistsPer90, firstTouchPct, poacherPct, rightFoot, leftFoot, header]

    PlayerDnaBest:
      type: object
      properties:
        label: { type: string }
        count: { type: integer }
      required: [label, count]

    PlayerDnaResponse:
      type: object
      properties:
        player:            { type: string }
        minsPlayed:        { type: integer }
        appearances:       { type: integer }
        minsPerGoal:       { type: ["integer", "null"] }
        metrics:           { $ref: "#/components/schemas/PlayerDnaMetrics" }
        squadMax:          { $ref: "#/components/schemas/PlayerDnaMetrics" }
        squadAvg:          { $ref: "#/components/schemas/PlayerDnaAverages" }
        firstTouchYes:     { type: integer }
        firstTouchTotal:   { type: integer }
        poacherYes:           { type: integer }
        poacherTotal:         { type: integer }
        favouriteOpponent: { oneOf: [{ $ref: "#/components/schemas/PlayerDnaBest" }, { type: "null" }] }
        topAssistPartner:  { oneOf: [{ $ref: "#/components/schemas/PlayerDnaBest" }, { type: "null" }] }
      required: [player, minsPlayed, appearances, minsPerGoal, metrics, squadMax, squadAvg, firstTouchYes, firstTouchTotal, poacherYes, poacherTotal, favouriteOpponent, topAssistPartner]

    # ── Opponent Goal Breakdown ────────────────────────────────────────────────

    OpponentGoalDetail:
      type: object
      properties:
        id:              { type: integer }
        minuteScored:    { type: ["integer", "null"] }
        goalType:        { type: ["string", "null"] }
        assistType:      { type: ["string", "null"] }
        buildupLane:     { type: ["string", "null"] }
        howPenetrated:   { type: ["string", "null"] }
        finishType:      { type: ["string", "null"] }
        firstTimeFinish: { type: ["boolean", "null"] }
        scorer:          { type: ["string", "null"] }
        assist:          { type: ["string", "null"] }
        matchDate:       { type: ["string", "null"] }
      required: [id]

    OpponentGoalBreakdownResponse:
      type: object
      properties:
        scored:
          type: array
          items: { $ref: "#/components/schemas/OpponentGoalDetail" }
        conceded:
          type: array
          items: { $ref: "#/components/schemas/OpponentGoalDetail" }
      required: [scored, conceded]

    # ── Opponent Profile (club-centric scouting across all their games) ─────────

    OpponentProfileRecord:
      type: object
      properties:
        played:       { type: integer }
        won:          { type: integer }
        drawn:        { type: integer }
        lost:         { type: integer }
        goalsFor:     { type: integer }
        goalsAgainst: { type: integer }
        goalDiff:     { type: integer }
        points:       { type: integer }
        position:     { type: ["integer", "null"] }
      required: [played, won, drawn, lost, goalsFor, goalsAgainst, goalDiff, points, position]

    OpponentProfileMatch:
      type: object
      properties:
        matchId:   { type: string }
        matchDate: { type: ["string", "null"] }
        opponent:  { type: string }
        homeAway:  { type: string }
        scored:    { type: integer }
        conceded:  { type: integer }
        result:    { type: string }
      required: [matchId, matchDate, opponent, homeAway, scored, conceded, result]

    OpponentProfileBucket:
      type: object
      properties:
        label: { type: string }
        total: { type: integer }
        byOpponent:
          type: object
          additionalProperties: { type: integer }
      required: [label, total, byOpponent]

    OpponentProfileScorer:
      type: object
      properties:
        scorer: { type: string }
        goals:  { type: integer }
      required: [scorer, goals]

    # Raw goal record (club-relative) powering detail-by-type, goal-map, 5-min response, first-goal.
    OpponentProfileGoal:
      type: object
      properties:
        matchId:         { type: string }
        matchDate:       { type: ["string", "null"] }
        minuteScored:    { type: ["integer", "null"] }
        side:            { type: string }                 # "scored" | "conceded" (relative to selected club)
        opponent:        { type: string }                 # the OTHER team in that fixture
        scorer:          { type: ["string", "null"] }
        assist:          { type: ["string", "null"] }
        goalType:        { type: ["string", "null"] }
        assistType:      { type: ["string", "null"] }
        howPenetrated:   { type: ["string", "null"] }
        buildupLane:     { type: ["string", "null"] }
        firstTimeFinish: { type: ["boolean", "null"] }
        finishType:      { type: ["string", "null"] }
        passString:      { type: ["string", "null"] }
        goalX:           { type: ["string", "null"] }
        goalY:           { type: ["string", "null"] }
      required: [matchId, matchDate, minuteScored, side, opponent, scorer, assist, goalType, assistType, howPenetrated, buildupLane, firstTimeFinish, finishType, passString, goalX, goalY]

    # Per-player season aggregate for the selected club (or whole league under __ALL__).
    OpponentProfilePlayer:
      type: object
      properties:
        playerName:  { type: string }
        club:        { type: ["string", "null"] }
        minsPlayed:  { type: integer }
        starts:      { type: integer }
        appearances: { type: integer }
        goals:       { type: integer }
        assists:     { type: integer }
      required: [playerName, club, minsPlayed, starts, appearances, goals, assists]

    PlayerTimelineMatch:
      type: object
      properties:
        matchId:   { type: string }
        matchDate: { type: ["string", "null"] }
        opponent:  { type: ["string", "null"] }
        status:    { type: string, enum: [start, bench, out] }
        minutes:   { type: integer }
      required: [matchId, matchDate, opponent, status, minutes]

    PlayerTimelineResponse:
      type: object
      properties:
        player:  { type: string }
        club:    { type: string }
        matches:
          type: array
          items:
            $ref: "#/components/schemas/PlayerTimelineMatch"
      required: [player, club, matches]

    OpponentProfileResponse:
      type: object
      # NOTE: playersLast3 = same aggregate as players, but only over the
      # club's 3 most-recent fixtures (empty for the __ALL__ view).
      properties:
        club:      { type: string }
        opponents:
          type: array
          items: { type: string }
        record:
          $ref: "#/components/schemas/OpponentProfileRecord"
        matches:
          type: array
          items: { $ref: "#/components/schemas/OpponentProfileMatch" }
        scoredByInterval:
          type: array
          items: { $ref: "#/components/schemas/OpponentProfileBucket" }
        concededByInterval:
          type: array
          items: { $ref: "#/components/schemas/OpponentProfileBucket" }
        scoredByType:
          type: array
          items: { $ref: "#/components/schemas/OpponentProfileBucket" }
        concededByType:
          type: array
          items: { $ref: "#/components/schemas/OpponentProfileBucket" }
        topScorers:
          type: array
          items: { $ref: "#/components/schemas/OpponentProfileScorer" }
        goals:
          type: array
          items: { $ref: "#/components/schemas/OpponentProfileGoal" }
        players:
          type: array
          items: { $ref: "#/components/schemas/OpponentProfilePlayer" }
        playersLast3:
          type: array
          items: { $ref: "#/components/schemas/OpponentProfilePlayer" }
      required: [club, opponents, record, matches, scoredByInterval, concededByInterval, scoredByType, concededByType, topScorers, goals, players, playersLast3]

    AdminLoginBody:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]

    LeagueAccess:
      type: object
      properties:
        leagueId: { type: integer }
        role:
          type: string
          enum: [admin, viewer]
          description: Legacy; derived from modules (data-entry ⇒ admin).
        modules:
          type: array
          items: { type: string }
          description: Per-league pages this user may use (season-stats, gps, testing, match-prep, reflections, data-entry).
        club:
          type: ["string", "null"]
          description: The user's own club in this league — Team/Player insights centre on it. Null = league default focus club.
      required: [leagueId, role, modules]

    SessionUserInfo:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        isSuperadmin: { type: boolean }
        leagues:
          type: array
          items: { $ref: "#/components/schemas/LeagueAccess" }
      required: [id, email, name, isSuperadmin, leagues]

    AuthStatus:
      type: object
      properties:
        authenticated: { type: boolean }
        role:
          type: string
          enum: [admin, viewer]
          description: Present when authenticated. Admin can write data somewhere; viewer is read-only everywhere.
        user: { $ref: "#/components/schemas/SessionUserInfo" }
      required: [authenticated]

    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string }

    ForgotPasswordRequest:
      type: object
      properties:
        email: { type: string }
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token: { type: string }
        newPassword: { type: string }
      required: [token, newPassword]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }
      required: [currentPassword, newPassword]

    OkResponse:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]

    UserInfo:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        isSuperadmin: { type: boolean }
        leagues:
          type: array
          items: { $ref: "#/components/schemas/LeagueAccess" }
        createdAt: { type: string }
        lastLoginAt: { type: string, nullable: true }
        # Present on the list endpoint only (omitted from create/update responses):
        possiblyShared: { type: boolean }
        # Superadmin marked this account as "expected to look shared" — no alert emails.
        sharedOk: { type: boolean }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/UserActivitySample" }
      required: [id, email, name, isSuperadmin, leagues, createdAt, lastLoginAt]

    UserActivitySample:
      type: object
      properties:
        seenAt: { type: string }
        userAgent: { type: string }
        ip: { type: string }
        # Approximate city resolved from the IP, e.g. "Canberra"; null when unknown.
        location: { type: string, nullable: true }
        device: { type: string }
      required: [seenAt, userAgent, ip, location, device]

    SetSharedOkRequest:
      type: object
      properties:
        sharedOk: { type: boolean }
      required: [sharedOk]

    CreateUserRequest:
      type: object
      properties:
        email: { type: string }
        name: { type: string }
        password: { type: string }
        isSuperadmin: { type: boolean }
        leagues:
          type: array
          items: { $ref: "#/components/schemas/LeagueAccess" }
      required: [email, name]

    UpdateUserRequest:
      type: object
      properties:
        email: { type: string }
        name: { type: string }
        password: { type: string }
        isSuperadmin: { type: boolean }
        leagues:
          type: array
          items: { $ref: "#/components/schemas/LeagueAccess" }

    LeagueMatchInfo:
      type: object
      properties:
        id:        { type: integer }
        matchId:   { type: string }
        matchDate: { type: ["string", "null"] }
        homeTeam:  { type: string }
        awayTeam:  { type: string }
        fullScore: { type: ["string", "null"] }
        homeGoals: { type: ["integer", "null"] }
        awayGoals: { type: ["integer", "null"] }
      required: [id, matchId, matchDate, homeTeam, awayTeam, fullScore, homeGoals, awayGoals]

    GpsFixtureInfo:
      type: object
      properties:
        round:        { type: string }
        opponent:     { type: string }
        matchDate:    { type: ["string", "null"] }
        matchDateIso: { type: ["string", "null"] }
        year:         { type: string }
        squad:        { type: string }
      required: [round, opponent, matchDate, matchDateIso, year, squad]

    GoalOptionsResponse:
      type: object
      properties:
        goalTypes:     { type: array, items: { type: string } }
        assistTypes:   { type: array, items: { type: string } }
        howPenetrated: { type: array, items: { type: string } }
        buildupLanes:  { type: array, items: { type: string } }
        finishTypes:   { type: array, items: { type: string } }
        conditions:    { type: array, items: { type: string } }
        venues:        { type: array, items: { type: string } }
        formations:    { type: array, items: { type: string } }
      required: [goalTypes, assistTypes, howPenetrated, buildupLanes, finishTypes, conditions, venues, formations]

    GoalVocabResponse:
      type: object
      properties:
        goalTypes:     { type: array, items: { type: string } }
        assistTypes:   { type: array, items: { type: string } }
        howPenetrated: { type: array, items: { type: string } }
        buildupLanes:  { type: array, items: { type: string } }
        finishTypes:   { type: array, items: { type: string } }
        sources:       { type: array, items: { type: string } }
      required: [goalTypes, assistTypes, howPenetrated, buildupLanes, finishTypes, sources]

    GoalVocabBody:
      type: object
      properties:
        goalTypes:     { type: array, items: { type: string, minLength: 1 }, minItems: 1 }
        assistTypes:   { type: array, items: { type: string, minLength: 1 }, minItems: 1 }
        howPenetrated: { type: array, items: { type: string, minLength: 1 }, minItems: 1 }
        buildupLanes:  { type: array, items: { type: string, minLength: 1 }, minItems: 1 }
        finishTypes:   { type: array, items: { type: string, minLength: 1 }, minItems: 1 }
        sources:       { type: array, items: { type: string, minLength: 1 }, minItems: 1 }
      required: [goalTypes, assistTypes, howPenetrated, buildupLanes, finishTypes, sources]

    EntryMatchBody:
      type: object
      properties:
        teamId:       { type: integer }
        seasonId:     { type: integer }
        matchId:      { type: string, minLength: 1 }
        matchDate:    { type: string, minLength: 1 }
        homeTeam:     { type: string, minLength: 1 }
        awayTeam:     { type: string, minLength: 1 }
        homeGoals:    { type: integer, minimum: 0 }
        awayGoals:    { type: integer, minimum: 0 }
        venue:        { type: ["string", "null"] }
        halfScore:    { type: ["string", "null"] }
        conditions:   { type: ["string", "null"] }
        formation:    { type: ["string", "null"] }
        oppFormation: { type: ["string", "null"] }
        possession:   { type: ["number", "null"], minimum: 0, maximum: 100 }
        shots:        { type: ["integer", "null"], minimum: 0 }
        passes:       { type: ["integer", "null"], minimum: 0 }
        oppShots:     { type: ["integer", "null"], minimum: 0 }
        oppPasses:    { type: ["integer", "null"], minimum: 0 }
      required: [teamId, seasonId, matchId, matchDate, homeTeam, awayTeam, homeGoals, awayGoals]

    EntryMatchResponse:
      type: object
      properties:
        leagueMatchId:    { type: integer }
        belconnenMatchId: { type: ["integer", "null"] }
        fullScore:        { type: string }
      required: [leagueMatchId, belconnenMatchId, fullScore]

    EntryGoalBody:
      type: object
      properties:
        teamId:          { type: integer }
        seasonId:        { type: integer }
        matchId:         { type: string, minLength: 1 }
        scorerTeam:      { type: string, minLength: 1 }
        minuteScored:    { type: ["integer", "null"], minimum: 0, maximum: 130 }
        scorer:          { type: ["string", "null"] }
        assist:          { type: ["string", "null"] }
        goalType:        { type: ["string", "null"] }
        assistType:      { type: ["string", "null"] }
        howPenetrated:   { type: ["string", "null"] }
        buildupLane:     { type: ["string", "null"] }
        firstTimeFinish: { type: ["boolean", "null"] }
        finishType:      { type: ["string", "null"] }
        passString:      { type: ["string", "null"] }
        source:          { type: ["string", "null"] }
        goalX:           { type: ["number", "null"], minimum: 0, maximum: 100 }
        goalY:           { type: ["number", "null"], minimum: 0 }
      required: [teamId, seasonId, matchId, scorerTeam]

    EntryGoalResponse:
      type: object
      properties:
        leagueGoalId:    { type: integer }
        belconnenGoalId: { type: ["integer", "null"] }
      required: [leagueGoalId, belconnenGoalId]

    DriblPreviewGoal:
      type: object
      properties:
        scorerTeam: { type: string }
        scorer:     { type: string }
        minute:     { type: ["integer", "null"] }
        ownGoal:    { type: boolean }
        penalty:    { type: boolean }
      required: [scorerTeam, scorer, minute, ownGoal, penalty]

    DriblPreviewMatch:
      type: object
      properties:
        matchId:    { type: string }
        round:      { type: integer }
        matchDate:  { type: string }
        homeTeam:   { type: string }
        awayTeam:   { type: string }
        driblHome:  { type: string }
        driblAway:  { type: string }
        homeGoals:  { type: integer }
        awayGoals:  { type: integer }
        halfScore:  { type: ["string", "null"] }
        exists:     { type: boolean }
        goalsOnly:  { type: boolean }
        unmatched:
          type: array
          items: { type: string }
        goals:
          type: array
          items: { $ref: "#/components/schemas/DriblPreviewGoal" }
        statsOnly: { type: boolean }
        playerStats:
          type: array
          items: { $ref: "#/components/schemas/DriblPreviewClubStats" }
        newGoalNames:
          type: array
          items: { type: string }
          description: "Display names claimed fresh this sync from goal events with no line-up block (e.g. \"S.Wells (Belconnen)\") — review in the player name map"
      required: [matchId, round, matchDate, homeTeam, awayTeam, driblHome, driblAway, homeGoals, awayGoals, halfScore, exists, goalsOnly, unmatched, goals, statsOnly, playerStats]

    DriblPreviewPlayerRow:
      type: object
      properties:
        playerName:  { type: string }
        shirtNumber: { type: ["string", "null"] }
        minsPlayed:  { type: integer }
        started:     { type: boolean }
        appearance:  { type: boolean }
        position:    { type: ["string", "null"] }
      required: [playerName, minsPlayed, started, appearance, position]

    DriblPreviewClubStats:
      type: object
      properties:
        club:   { type: string }
        exists: { type: boolean }
        rows:
          type: array
          items: { $ref: "#/components/schemas/DriblPreviewPlayerRow" }
        newNames:
          type: array
          items: { type: string }
          description: Display names claimed fresh this sync (no prior mapping) — review them in the player name map before/after importing
      required: [club, exists, rows]

    DriblNameMapEntry:
      type: object
      properties:
        id:          { type: integer }
        club:        { type: string }
        fullName:    { type: string }
        displayName: { type: string }
        statRows:    { type: integer, description: Saved league player-stat rows currently using this display name }
      required: [id, club, fullName, displayName, statRows]

    DriblNameMapListResponse:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/DriblNameMapEntry" }
      required: [rows]

    DriblNameMapUpdateBody:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
      required: [displayName]

    DriblNameMapUpdateResponse:
      type: object
      properties:
        displayName:   { type: string }
        renamedStats:  { type: integer, description: League player-stat rows renamed }
        renamedGoals:  { type: integer, description: League goal rows (scorer or assist) renamed }
        renamedMirror: { type: integer, description: Legacy focus-club mirror rows renamed }
      required: [displayName, renamedStats, renamedGoals, renamedMirror]

    DriblNameMapDeleteResponse:
      type: object
      properties:
        deleted: { type: boolean }
      required: [deleted]

    DriblNeedLineup:
      type: object
      properties:
        match: { type: string }
        team:  { type: string }
      required: [match, team]

    DriblPreviewResponse:
      type: object
      properties:
        driblSeason: { type: string }
        driblLeague: { type: string }
        matches:
          type: array
          items: { $ref: "#/components/schemas/DriblPreviewMatch" }
        needDetail:
          type: array
          items: { type: string }
        needLineups:
          type: array
          items: { $ref: "#/components/schemas/DriblNeedLineup" }
        skippedNoLineups:
          type: integer
          description: Club sheets skipped because a previous sync found no published line-up
        suggestedClubs:
          type: array
          items: { type: string }
          description: Only when the league has no clubs yet — cleaned team names from the fixture list, offered for one-click club creation
      required: [driblSeason, driblLeague, matches, needDetail, needLineups, skippedNoLineups]

    DriblConfigResponse:
      type: object
      properties:
        driblLeague:      { type: string }
        driblCompetition: { type: string }
        driblYear:        { type: string }
        driblTenantSlug:
          type: string
          description: Dribl federation subdomain, e.g. "capital" (Capital Football) or "fv" (Football Victoria).
      required: [driblLeague, driblCompetition, driblYear, driblTenantSlug]

    DriblRawFixture:
      type: object
      properties:
        fullRound:    { type: string }
        date:         { type: string }
        status:       { type: string }
        homeTeamName: { type: string }
        awayTeamName: { type: string }
        homeScore:    { type: ["integer", "null"] }
        awayScore:    { type: ["integer", "null"] }
        homeScoreHt:  { type: ["integer", "null"] }
        awayScoreHt:  { type: ["integer", "null"] }
        matchHashId:  { type: string }
      required: [fullRound, date, status, homeTeamName, awayTeamName, homeScore, awayScore, matchHashId]

    DriblRawEvent:
