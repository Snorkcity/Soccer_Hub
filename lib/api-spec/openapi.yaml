        "200":
          description: Coach emails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GpsCoachEmail"
    put:
      operationId: saveMatchReportCoachEmails
      tags: [analytics]
      summary: Replace the football coach email list for one league (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchReportCoachEmailsSaveRequest"
      responses:
        "200":
          description: Save result
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: integer }
                required: [saved]

  /match-report-email:
    post:
      operationId: sendMatchReportEmail
      tags: [analytics]
      summary: Email one coach the football match report deck (PPTX built client-side, sent as attachment; admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GpsReportEmailRequest"
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                required: [sent]

  /gps-coach-emails:
    get:
      operationId: listGpsCoachEmails
      tags: [gps]
      summary: List the coach email list for a league (all squads)
      parameters:
        - name: leagueId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Coach emails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GpsCoachEmail"
    put:
      operationId: saveGpsCoachEmails
      tags: [gps]
      summary: Replace the coach email list for one league + squad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GpsCoachEmailsSaveRequest"
      responses:
        "200":
          description: Save result
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: integer }
                required: [saved]

  /journal/interview/speak:
    post:
      operationId: journalInterviewSpeak
      tags: [journal]
      summary: Convert interview question text to spoken audio (coach's OpenAI key)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewSpeakRequest"
      responses:
        "200":
          description: Spoken audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSpeakResponse"

  /journal/interview/turn:
    post:
      operationId: journalInterviewTurn
      tags: [journal]
      summary: Transcribe one spoken interview turn and decide the next step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewTurnRequest"
      responses:
        "200":
          description: Turn result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewTurnResponse"

  /journal/last-meeting:
    get:
      operationId: getLastMeetingFacts
      tags: [journal]
      summary: Headline facts from the last league meeting vs an opponent this season
      parameters:
        - name: seasonId
          in: query
          required: true
          schema: { type: integer }
        - name: opponent
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Fact lines (empty when it's the first meeting of the season)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LastMeetingFactsResponse"

  /journal/week-ahead-brief:
    post:
      operationId: createWeekAheadBrief
      tags: [journal]
      summary: AI summary + prep pointers for the Monday Week Ahead report (coach's OpenAI key)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeekAheadBriefRequest"
      responses:
        "200":
          description: Review bullets and prep pointers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekAheadBriefResponse"

  /journal/prematch-brief:
    post:
      operationId: createPrematchBrief
      tags: [journal]
      summary: AI key objectives (BP/BPO by unit) for the Friday pre-match deck (coach's OpenAI key)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrematchBriefRequest"
      responses:
        "200":
          description: BP and BPO objectives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrematchBriefResponse"

  /journal/prematch-talk:
    post:
      operationId: createPrematchTalk
      tags: [journal]
      summary: AI talking points for the Friday deck team-talk box, drawing on previous talks vs the same opponent (coach's OpenAI key)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrematchTalkRequest"
      responses:
        "200":
          description: Suggested talking-point lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrematchTalkResponse"

  /journal/interview/writeup:
    post:
      operationId: journalInterviewWriteup
      tags: [journal]
      summary: Write up interview answers into journal fields in the coach's voice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewWriteupRequest"
      responses:
        "200":
          description: Drafted journal content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewWriteupResponse"

  /entry/veo-sync:
    post:
      operationId: veoSync
      tags: [veo]
      summary: Pull a squad's match data from Veo (incremental, batch-capped)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VeoSyncInput" }
      responses:
        "200":
          description: Sync progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VeoSyncResult" }

  /veo/leagues:
    get:
      operationId: listVeoLeagues
      tags: [veo]
      summary: Leagues that have a Veo team mapping (can be synced)
      responses:
        "200":
          description: Veo-mapped leagues
          content:
            application/json:
              schema:
                type: object
                required: [leagues]
                properties:
                  leagues:
                    type: array
                    items: { $ref: "#/components/schemas/VeoLeague" }

  /veo/matches:
    get:
      operationId: listVeoMatches
      tags: [veo]
      summary: Synced Veo matches for a league (metadata only)
      parameters:
        - name: leagueId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Synced match list
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/VeoMatchSummary" }

  /veo/season:
    get:
      operationId: getVeoSeason
      tags: [veo]
      summary: Season-wide per-match Veo event counts (for/against by event type)
      parameters:
        - name: leagueId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Per-match event counts across every synced match, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/VeoSeasonMatch" }

  /veo/season-shots:
    get:
      operationId: getVeoSeasonShots
      tags: [veo]
      summary: Season-wide shot locations and minutes across every synced match
      parameters:
        - name: leagueId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Per-match normalised shot events (we always attack right), oldest first
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/VeoSeasonShotMatch" }

  /veo/season-passing:
    get:
      operationId: getVeoSeasonPassing
      tags: [veo]
      summary: Season-wide per-match possession & passing summaries from Veo RAS analytics
      parameters:
        - name: leagueId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Per-match passing/possession summaries, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/VeoSeasonPassingMatch" }

  /veo/match:
    get:
      operationId: getVeoMatch
      tags: [veo]
      summary: One synced Veo match with its raw events/stats/periods/roster
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
        - name: leagueId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Veo match detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VeoMatchDetail" }

  /veo/links:
    get:
      operationId: listVeoLinks
      tags: [veo]
      summary: Veo↔Hub match links for a league, plus the Hub matches to link to
      parameters:
        - name: leagueId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Link rows and Hub match options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VeoLinksResponse" }

  /entry/veo-auto-link:
    post:
      operationId: veoAutoLink
      tags: [veo]
      summary: Auto-link unlinked Veo matches to Hub matches by kickoff date (±1 day) and opponent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VeoAutoLinkInput" }
      responses:
        "200":
          description: Auto-link outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VeoAutoLinkResult" }

  /entry/veo-link:
    post:
      operationId: veoSetLink
      tags: [veo]
      summary: Manually set or clear the Hub match a Veo match is linked to
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VeoSetLinkInput" }
      responses:
        "200":
          description: Link updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VeoSetLinkResult" }

  /entry/veo-refetch:
    post:
      operationId: veoRefetchMatch
      tags: [veo]
      summary: Clear and re-download stats for a single Veo game (e.g. after fixing team directions in Veo)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VeoRefetchInput" }
      responses:
        "200":
          description: Refetch succeeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VeoSetLinkResult" }

  /entry/veo-remove:
    post:
      operationId: veoRemoveMatch
      tags: [veo]
      summary: Soft-delete or restore a synced Veo game (payloads kept; hidden from all charts and reports)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VeoRemoveInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VeoSetLinkResult" }

  /veo/report-stats:
    get:
      operationId: getVeoReportStats
      tags: [veo]
      summary: Veo shots + momentum for the Hub match a report is showing (via the link)
      parameters:
        - name: leagueId
          in: query
          required: true
          schema: { type: integer }
        - name: matchRowId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Linked Veo stats, or linked=false when no Veo match is linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VeoReportStats" }

components:
  schemas:
    VeoSyncInput:
      type: object
      required: [leagueId]
      properties:
        leagueId: { type: integer }
        batch: { type: integer }
    VeoSyncResult:
      type: object
      required: [league, totalMatches, fetched, remaining, analyticsPending, done]
      properties:
        league: { type: string }
        totalMatches: { type: integer }
        fetched: { type: integer }
        remaining: { type: integer }
        analyticsPending: { type: integer }
        done: { type: boolean }
    VeoLeague:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        veoTeamSlug: { type: string, nullable: true }
    VeoMatchSummary:
      type: object
      required: [id, veoMatchId, synced]
      properties:
        id: { type: integer }
        veoMatchId: { type: string }
        title: { type: string, nullable: true }
        opponent: { type: string, nullable: true }
        startsAt: { type: string, nullable: true }
        matchCode: { type: string, nullable: true }
        hubOpponent: { type: string, nullable: true }
        hasAnalytics: { type: boolean }
        hasEvents: { type: boolean }
        hasTracking: { type: boolean }
        hasMomentum: { type: boolean }
        synced: { type: boolean }
        syncedAt: { type: string, nullable: true }
        pendingAnalytics: { type: boolean }
    VeoEvent:
      type: object
      required: [event_type, team, period_id, period_time_ms]
      properties:
        id: { type: string }
        event_type: { type: string }
        team: { type: string }
        video_time_ms: { type: number, nullable: true }
        period_id: { type: integer }
        period_time_ms: { type: number }
        player_jersey: { type: integer, nullable: true }
        player_id: { type: string, nullable: true }
        outcome: { type: string, nullable: true }
        x: { type: number, nullable: true }
        z: { type: number, nullable: true }
    VeoSeasonMatch:
      type: object
      required: [id, veoMatchId, countsFor, countsAgainst]
      properties:
        id: { type: integer }
        veoMatchId: { type: string }
        title: { type: string, nullable: true }
        opponent: { type: string, nullable: true }
        startsAt: { type: string, nullable: true }
        matchCode: { type: string, nullable: true }
        hubOpponent: { type: string, nullable: true }
        countsFor:
          type: object
          additionalProperties: { type: number }
        countsAgainst:
          type: object
          additionalProperties: { type: number }
    VeoSeasonShot:
      type: object
      required: [minute, goal, us]
      properties:
        x: { type: number, nullable: true }
        y: { type: number, nullable: true }
        minute: { type: number }
        goal: { type: boolean }
        us: { type: boolean }
    VeoSeasonShotMatch:
      type: object
      required: [id, veoMatchId, shots]
      properties:
        id: { type: integer }
        veoMatchId: { type: string }
        title: { type: string, nullable: true }
        opponent: { type: string, nullable: true }
        startsAt: { type: string, nullable: true }
        matchCode: { type: string, nullable: true }
        hubOpponent: { type: string, nullable: true }
        shots:
          type: array
          items: { $ref: "#/components/schemas/VeoSeasonShot" }
    VeoMatchDetail:
      type: object
      required: [id, veoMatchId]
      properties:
        id: { type: integer }
        leagueId: { type: integer }
        veoMatchId: { type: string }
        veoTeamSlug: { type: string, nullable: true }
        title: { type: string, nullable: true }
        opponent: { type: string, nullable: true }
        startsAt: { type: string, nullable: true }
        hasAnalytics: { type: boolean }
        hasEvents: { type: boolean }
        hasTracking: { type: boolean }
        hasMomentum: { type: boolean }
        events:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/VeoEvent" }
        stats:
          type: object
          nullable: true
          additionalProperties: true
        periods:
          type: array
          nullable: true
          items: { type: object, additionalProperties: true }
        roster:
          type: object
          nullable: true
          additionalProperties: true
        passDetails:
          type: object
          nullable: true
          additionalProperties: true
        matchId: { type: integer, nullable: true }
        syncedAt: { type: string, nullable: true }
    VeoPassStringBucket:
      type: object
      required: [len, count]
      properties:
        len: { type: integer }
        count: { type: integer }
    VeoThirds:
      type: object
      required: [defensive, middle, attacking]
      properties:
        defensive: { type: number }
        middle: { type: number }
        attacking: { type: number }
    VeoSeasonPassingMatch:
      type: object
      required:
        [id, veoMatchId, possessionSecUs, possessionSecThem, passesUs, passesThem,
         possessionWonUs, possessionWonThem, passStringsUs, passStringsThem, thirdsUs, thirdsThem]
      properties:
        id: { type: integer }
        veoMatchId: { type: string }
        title: { type: string, nullable: true }
        opponent: { type: string, nullable: true }
        startsAt: { type: string, nullable: true }
        matchCode: { type: string, nullable: true }
        possessionSecUs: { type: number }
        possessionSecThem: { type: number }
        passesUs: { type: number }
        passesThem: { type: number }
        possessionWonUs: { type: number }
        possessionWonThem: { type: number }
        passStringsUs:
          type: array
          items: { $ref: "#/components/schemas/VeoPassStringBucket" }
        passStringsThem:
          type: array
          items: { $ref: "#/components/schemas/VeoPassStringBucket" }
        thirdsUs: { $ref: "#/components/schemas/VeoThirds" }
        thirdsThem: { $ref: "#/components/schemas/VeoThirds" }
        passLenUs:
          allOf: [{ $ref: "#/components/schemas/VeoPassLenStats" }]
          nullable: true
        passLenThem:
          allOf: [{ $ref: "#/components/schemas/VeoPassLenStats" }]
          nullable: true
    VeoPassLenStats:
      type: object
      required: [n, mean, longPct]
      properties:
        n: { type: number }
        mean: { type: number }
        longPct: { type: number }
    VeoScoreMismatch:
      type: object
      required: [veoFor, veoAgainst, hubFor, hubAgainst]
      properties:
        veoFor:     { type: integer }
        veoAgainst: { type: integer }
        hubFor:     { type: integer }
        hubAgainst: { type: integer }
    VeoLinkRow:
      type: object
      required: [id, veoMatchId, synced]
      properties:
        id: { type: integer }
        veoMatchId: { type: string }
        title: { type: string, nullable: true }
        opponent: { type: string, nullable: true }
        startsAt: { type: string, nullable: true }
        matchId: { type: integer, nullable: true }
        synced: { type: boolean }
        removed: { type: boolean }
        pendingAnalytics: { type: boolean }
        scoreMismatch:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/VeoScoreMismatch"
    HubMatchOption:
      type: object
      required: [id, matchId, opponent, teamId, seasonId]
      properties:
        id: { type: integer }
        matchId: { type: string }
        matchDate: { type: string, nullable: true }
        opponent: { type: string }
        teamId: { type: integer }
        seasonId: { type: integer }
    VeoLinksResponse:
      type: object
      required: [links, hubMatches]
      properties:
        links:
          type: array
          items: { $ref: "#/components/schemas/VeoLinkRow" }
        hubMatches:
          type: array
          items: { $ref: "#/components/schemas/HubMatchOption" }
    VeoAutoLinkInput:
      type: object
      required: [leagueId]
      properties:
        leagueId: { type: integer }
    VeoAutoLinkResult:
      type: object
      required: [linked, ambiguous, unmatched]
      properties:
        linked: { type: integer }
        ambiguous: { type: integer }
        unmatched: { type: integer }
    VeoSetLinkInput:
      type: object
      required: [leagueId, veoId]
      properties:
        leagueId: { type: integer }
        veoId: { type: integer }
        matchId: { type: integer, nullable: true }
    VeoRefetchInput:
      type: object
      required: [leagueId, veoId]
      properties:
        leagueId: { type: integer }
        veoId: { type: integer }
    VeoRemoveInput:
      type: object
      required: [leagueId, veoId, removed]
      properties:
        leagueId: { type: integer }
        veoId: { type: integer }
        removed: { type: boolean }
    VeoSetLinkResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    VeoShotTotals:
      type: object
      required: [us, them]
      properties:
        us: { type: integer }
        them: { type: integer }
    VeoMomentumBin:
      type: object
      required: [min, us, them]
      properties:
        min: { type: integer }
        us: { type: number }
        them: { type: number }
    VeoReportStats:
      type: object
      required: [linked]
      properties:
        linked: { type: boolean }
        veoId: { type: integer, nullable: true }
        startsAt: { type: string, nullable: true }
        shots: { $ref: "#/components/schemas/VeoShotTotals" }
        momentum:
          type: array
          items: { $ref: "#/components/schemas/VeoMomentumBin" }
        # ── Match intelligence (all optional for saved-jsonb back-compat) ──
        findings:
          type: array
          items: { $ref: "#/components/schemas/VeoReportFinding" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/VeoReportMoment" }
        tilt:
          type: array
          items: { $ref: "#/components/schemas/VeoReportTiltPoint" }
        tiltHalfAt: { type: number, nullable: true }
        tiltMaxMin: { type: number, nullable: true }
        radar:
          type: array
          items: { $ref: "#/components/schemas/VeoReportRadarRow" }
        possession: { $ref: "#/components/schemas/VeoReportPossession" }
    VeoReportFinding:
      type: object
      required: [tone, text]
      properties:
        tone: { type: string, enum: [good, watch, info] }
        text: { type: string }
    VeoReportMoment:
      type: object
      required: [min, type, us]
      properties:
        min: { type: number }
        type: { type: string, enum: [goal, shot, corner] }
        us: { type: boolean }
    VeoReportTiltPoint:
      type: object
      required: [min]
      properties:
        min: { type: number }
        tiltDiff: { type: number, nullable: true }
        passDiff: { type: number, nullable: true }
    VeoReportRadarRow:
      type: object
      required: [metric, us, them, rawUs, rawThem]
      properties:
        metric: { type: string }
        us: { type: number }
        them: { type: number }
        rawUs: { type: string }
        rawThem: { type: string }
    VeoReportPossession:
      type: object
      required: [usPct, usMin, themMin]
      properties:
        usPct: { type: number }
        usMin: { type: number }
        themMin: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Players ──────────────────────────────────────────────────────────────

    Player:
      type: object
      properties:
        id:        { type: integer }
        name:      { type: string }
        position:  { type: ["string", "null"] }
        club:      { type: ["string", "null"] }
        dob:       { type: ["string", "null"] }
        createdAt: { type: string }
