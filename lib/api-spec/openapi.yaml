        round:     { type: ["string", "null"] }
        opponent:  { type: ["string", "null"] }
        matchDate: { type: ["string", "null"] }
        data:
          type: object
          additionalProperties: true
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, leagueId, title, round, opponent, matchDate, data, createdAt, updatedAt]

    GpsMatchReportCreateRequest:
      type: object
