        title:     { type: string, minLength: 1 }
        round:     { type: string }
        opponent:  { type: string }
        matchDate: { type: string }
        data:
          type: object
          additionalProperties: true
      required: [leagueId, title, data]

    MatchReportCoachEmailsSaveRequest:
      type: object
      properties:
        leagueId: { type: integer }
        coaches:
          type: array
          items:
            type: object
            properties:
              name:  { type: string }
              email: { type: string, minLength: 3 }
            required: [email]
      required: [leagueId, coaches]

    GpsCoachEmail:
      type: object
      properties:
        id:       { type: integer }
        leagueId: { type: integer }
        squad:    { type: string }
