        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalDeleteResult"

  /match-report-coach-emails:
    get:
      operationId: listMatchReportCoachEmails
      tags: [analytics]
      summary: List the football coach email list for a league
      parameters:
        - name: leagueId
